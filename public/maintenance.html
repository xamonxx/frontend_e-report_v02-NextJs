<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>503 — Layanan Sementara Tidak Tersedia | E-Report</title>
  <style>
    :root {
      --bg: #020617;
      --card: #131b2e;
      --border: #1e293b;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      background-image:
        linear-gradient(to right, rgba(71, 85, 105, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(71, 85, 105, 0.18) 1px, transparent 1px),
        radial-gradient(circle at 50% 42%, rgba(245, 158, 11, 0.10) 0%, transparent 60%);
      background-size: 34px 34px, 34px 34px, 100% 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      background: rgba(245, 158, 11, 0.06);
      color: var(--amber);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .code {
      font-size: clamp(96px, 28vw, 150px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--amber), #fcd34d 55%, #b45309);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 30px rgba(245, 158, 11, 0.18));
    }
    h1 {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 700;
      color: var(--fg);
    }
    p.sub {
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }
    .actions {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: none;
      cursor: pointer;
      background: var(--amber);
      color: #0b0f19;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 14px;
      box-shadow: 0 10px 28px -8px rgba(245, 158, 11, 0.55);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.97); }
    button svg { width: 16px; height: 16px; }
    .retry-hint {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
    }
    .footer {
      margin-top: 44px;
      font-size: 12px;
      color: #475569;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .footer img { width: 16px; height: 16px; opacity: 0.7; }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="badge"><span class="dot"></span> Status Server</span>

    <div class="code">503</div>
    <h1>Layanan Sementara Tidak Tersedia</h1>
    <p class="sub">
      Server sedang sibuk atau dalam pemeliharaan singkat.
      Halaman akan mencoba memuat ulang otomatis, atau coba lagi sekarang.
    </p>

    <div class="actions">
      <button type="button" onclick="window.location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" />
        </svg>
        Coba Lagi
      </button>
      <span class="retry-hint">Muat ulang otomatis dalam <strong id="count">20</strong> detik…</span>
    </div>

    <div class="footer">
      <img src="/logo.svg" alt="" onerror="this.style.display='none'" />
      E-Report — Putra Corporation
    </div>
  </main>

  <script>
    // Auto-retry: count down then reload, so the page recovers on its own
    // once the server is back. Stops counting if the tab is hidden.
    var remaining = 20;
    var el = document.getElementById('count');
    setInterval(function () {
      if (document.hidden) return;
      remaining -= 1;
      if (remaining <= 0) { window.location.reload(); return; }
      if (el) el.textContent = remaining;
    }, 1000);
  </script>
</body>
</html>
